# ./.github/workflows/release.yml
# Tag-only desktop publish. Quality gate is the reusable CI workflow; this job
# only builds signed installers after Validate passes. Push a v* tag (e.g. v0.2.3)
# that matches package.json / tauri.conf.json. Draft GitHub Releases include
# latest.json for in-app updates. Publish the draft after smoke-checking artifacts.
# Signing secrets: TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
# Matrix jobs run one at a time so tauri-action can merge latest.json safely.
# Use tauri-apps/tauri-action@v1 (latest 1.0.0). There is no @v2 action tag.
# Helper CLIs live in src-tauri/dev-bins so macOS universal bundling does not
# look for seed_mcp_fixture beside the app binary.

name: Publish Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate:
    name: Validate release candidate
    uses: ./.github/workflows/ci.yml

  publish-tauri:
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: "12"
          runtime: node@26
          install: false
          cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            webkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev

      - name: Install frontend dependencies
        run: node ./scripts/pnpm_unlocked.mjs install

      - name: Build Svelte frontend
        run: pnpm run build

      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set. Add the minisign private key as a repo secret."
            exit 1
          fi

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Genomics Caddy ${{ github.ref_name }}
          releaseBody: Automated cross-compiled release of ${{ github.ref_name }}.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Attach Windows portable zip
        if: matrix.platform == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node ./scripts/package_windows_portable.mjs --upload --tag ${{ github.ref_name }}

      - name: Rebuild macOS folder-layout DMG
        if: matrix.platform == 'macos-latest'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bash ./scripts/package_macos_folder_dmg.sh
          # package_macos_folder_dmg.sh calls sign_updater_artifact.sh after hdiutil.

      - name: Upload macOS folder-layout DMG
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dmg="$(find src-tauri/target -type f -name '*.dmg' ! -name 'rw.*' | head -1)"
          if [ -z "$dmg" ]; then
            echo "No macOS DMG found after folder-layout rebuild"
            exit 1
          fi
          if [ ! -f "${dmg}.sig" ]; then
            echo "Folder-layout DMG is missing ${dmg}.sig; updater latest.json would not match"
            exit 1
          fi
          gh release upload "${{ github.ref_name }}" "$dmg" "${dmg}.sig" --clobber
