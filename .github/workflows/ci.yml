# ./.github/workflows/ci.yml
# Pull/push quality gate and reusable release-candidate validation.
# Triggers on pull_request, push to master, workflow_dispatch, and workflow_call
# from Publish Release. Uses the lock-free installer; do not add --frozen-lockfile.
# Call lock-free audits with `node ./scripts/...` — `pnpm run` writes pnpm-lock.yaml.

name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
  workflow_dispatch:

jobs:
  downloader-platform:
    name: Downloader contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: "12"
          runtime: node@26
          install: false
          cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: node ./scripts/pnpm_unlocked.mjs install

      - name: Sync SvelteKit generated tsconfig
        run: pnpm exec svelte-kit sync

      - name: Build frontend for the Tauri build script
        run: pnpm run build

      - name: Run downloader contract tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib offline::download::tests

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: "12"
          runtime: node@26
          install: false
          cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Install Linux validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            webkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev

      - name: Install frontend dependencies
        run: node ./scripts/pnpm_unlocked.mjs install

      - name: Audit dependency reproducibility
        run: node ./scripts/audit_reproducibility.mjs

      - name: Audit updater config
        run: node ./scripts/audit_updater_config.mjs

      - name: Validate marker packs
        run: pnpm run validate:packs

      - name: Audit markers
        run: pnpm run audit:markers

      - name: Audit resources
        run: pnpm run audit:resources

      - name: Audit DNA fixtures
        run: pnpm run audit:dna-fixtures

      - name: Sync SvelteKit generated tsconfig
        run: pnpm exec svelte-kit sync

      - name: Run frontend tests
        run: pnpm test

      - name: Run Svelte check
        run: pnpm run check

      - name: Verify CSS loading
        run: pnpm run verify:css

      - name: Build frontend
        run: pnpm run build

      - name: Run Rust tests
        run: pnpm run cargo:test

      - name: Run Rust check
        run: pnpm run cargo:check

      - name: Run strict Rust Clippy
        run: pnpm run cargo:clippy
