# ./.github/workflows/release.yml
# Tag-only desktop publish. Quality gate is the reusable CI workflow; this job
# only builds installers after Validate passes. Push a v* tag (e.g. v0.2.0).
# Draft GitHub Releases are created; publish them after smoke-checking artifacts.

name: Publish Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate:
    name: Validate release candidate
    uses: ./.github/workflows/ci.yml

  publish-tauri:
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: "12"
          runtime: node@26
          install: false
          cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            webkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev

      - name: Install frontend dependencies
        run: node ./scripts/pnpm_unlocked.mjs install

      - name: Build Svelte frontend
        run: pnpm run build

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Genomics Caddy ${{ github.ref_name }}
          releaseBody: Automated cross-compiled release of ${{ github.ref_name }}.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
